name: Deploy Mercado

on:
  workflow_run:
    workflows: ["CI Mercado"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: mercado-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy produção
        shell: bash
        env:
          APP_DIR: /home/mercado/htdocs/mercado.superamplitude.com
          PORT: 3010
        run: |
          chmod +x deploy/bootstrap-vps.sh
          bash deploy/bootstrap-vps.sh

      - name: Health check
        shell: bash
        run: curl -fsS http://127.0.0.1:3010/api/health
