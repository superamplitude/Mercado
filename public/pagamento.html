<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento | Mercado SuperAmplitude</title><link rel="stylesheet" href="/styles.css"></head><body><main class="main" style="max-width:720px;margin-top:8vh"><div class="admin-card" style="text-align:center;padding:34px"><div class="brand" style="justify-content:center;margin-bottom:20px"><span class="brand-mark">M</span><span>Mercado</span></div><h1 id="title">Confirmando pagamento…</h1><p class="muted" id="message">Estamos consultando o status do seu pedido.</p><div id="orderBox" class="empty" style="margin:24px 0"></div><a class="pill primary" href="/" style="display:inline-block;text-decoration:none">Voltar para a loja</a></div></main><script>
const p=new URLSearchParams(location.search);const provider=p.get('provider');const order=p.get('order');const status=p.get('status');const paypalToken=p.get('token');const mpPayment=p.get('payment_id');const $=s=>document.querySelector(s);async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||`HTTP ${r.status}`);return b}async function getStatus(){if(!order)return null;const r=await fetch(`/api/orders/${encodeURIComponent(order)}/status`);if(!r.ok)return null;return r.json()}function show(o){if(!o){$('#title').textContent='Pedido recebido';$('#message').textContent='Não foi possível consultar o status agora.';$('#orderBox').textContent=order||'Pedido sem referência';return}const paid=o.payment_status==='paid';$('#title').textContent=paid?'Pagamento confirmado':'Pedido recebido';$('#message').textContent=paid?'Seu pagamento foi confirmado. O pedido seguirá para separação.':'O pagamento ainda está pendente ou em processamento.';$('#orderBox').innerHTML=`<strong>${o.order_number}</strong><br>Status do pedido: ${o.status}<br>Pagamento: ${o.payment_status}<br>Total: R$ ${Number(o.total).toFixed(2).replace('.',',')}`}async function run(){try{if(provider==='paypal'&&status==='return'&&paypalToken)await post('/api/payments/paypal/capture',{paypalOrderId:paypalToken});if(provider==='mercadopago'&&mpPayment)await post('/api/payments/mercadopago/confirm',{paymentId:mpPayment});show(await getStatus())}catch(e){$('#title').textContent='Pedido recebido';$('#message').textContent=e.message;show(await getStatus())}}run();
</script></body></html>
